<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LATENT AI</title>
    <meta name="description" content="LATENT AI - Local AI chat interface powered by Ollama" />
    <meta name="theme-color" content="#171c2e" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23a78bfa'/%3E%3Cpath d='M13 2 4 14h6l-1 8 9-12h-6l1-8z' fill='%230f1320'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <noscript>Is page ko chalane ke liye JavaScript on karo.</noscript>

    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="shell" id="shell">
    <div class="sb-backdrop" id="sbBackdrop"></div>
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <button class="sb-new" id="sbNew" type="button">+ New chat</button>
        <input class="sb-search" id="sbSearch" type="search" placeholder="Search chats..." autocomplete="off" />
        <nav class="sb-list" id="chatList"></nav>
    </aside>

    <div class="app" id="app">

        <!-- ========== HEADER ========== -->
        <header class="header">
            <div class="header-top">
                <div class="logo" aria-label="LATENT AI">
                    <button class="sb-toggle" id="sbToggle" type="button" title="Chats" aria-label="Toggle chat history">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    <span class="logo-icon">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" />
                        </svg>
                    </span>
                    <span class="logo-text">LATENT <span class="logo-accent">AI</span></span>
                </div>

                <div class="header-right">
                    <button class="new-chat" id="newChatBtn" type="button" title="New chat">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                        </svg>
                        <span>New chat</span>
                    </button>

                    <div class="location-badge" id="locationBadge" title="Your location">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                        <span id="locationText">India</span>
                    </div>
                </div>
            </div>

            <div class="header-controls">
                <!-- Language chips -->
                <div class="chips" id="languageChips" role="group" aria-label="Language selector">
                    <button class="chip active" data-lang="hi" type="button">
                        <span class="lang-code">IN</span> हिंदी
                    </button>
                    <button class="chip" data-lang="en" type="button">
                        <span class="lang-code">GB</span> English
                    </button>

                    <div class="chip chip-select-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M2 12h20" />
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                        </svg>
                        <select class="chip-select" id="moreLanguages" aria-label="More Indian languages">
                            <option value="">+12 Indian Languages</option>
                            <option value="bn">বাংলা (Bengali)</option>
                            <option value="ta">தமிழ் (Tamil)</option>
                            <option value="te">తెలుగు (Telugu)</option>
                            <option value="mr">मराठी (Marathi)</option>
                            <option value="gu">ગુજરાતી (Gujarati)</option>
                            <option value="kn">ಕನ್ನಡ (Kannada)</option>
                            <option value="ml">മലയാളം (Malayalam)</option>
                            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                            <option value="or">ଓଡ଼ିଆ (Odia)</option>
                            <option value="as">অসমীয়া (Assamese)</option>
                            <option value="ur">اردو (Urdu)</option>
                            <option value="sa">संस्कृतम् (Sanskrit)</option>
                        </select>
                    </div>
                </div>

                <!-- Feature mode toggles -->
                <div class="modes" id="modeToggles" role="group" aria-label="Feature modes">
                    <button class="mode-btn active" data-mode="normal" type="button">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        <span>Normal</span>
                    </button>
                    <button class="mode-btn" data-mode="critical" type="button">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 18h6" />
                            <path d="M10 22h4" />
                            <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z" />
                        </svg>
                        <span>Critical Thinking</span>
                    </button>
                    <button class="mode-btn" data-mode="web" type="button">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <span>Web Search</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- ========== CHAT AREA (only scrollable element) ========== -->
        <main class="chat-container" id="chatContainer" role="log" aria-live="polite">
            <div class="message ai welcome">
                <div class="bubble">
                    नमस्ते! मैं <strong>LATENT AI</strong> हूँ।<br />
                    Aap mujhse kuch bhi pooch sakte ho.
                </div>
            </div>
        </main>

        <!-- ========== BOTTOM INPUT BAR ========== -->
        <footer class="input-bar">
            <div class="attach-preview" id="attachPreview" hidden>
                <img id="attachImg" alt="Attached image" />
                <button id="attachRemove" type="button" aria-label="Remove image">&times;</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" hidden />

            <div class="input-row">
                <div class="action-icons">
                    <button class="icon-btn" id="attachBtn" type="button" title="Attach file" aria-label="Attach file">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path
                                d="m21.4 11.6-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" />
                        </svg>
                    </button>
                    <button class="icon-btn" id="micBtn" type="button" title="Voice input" aria-label="Voice input">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="2" width="6" height="12" rx="3" />
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
                            <path d="M12 18v4" />
                        </svg>
                    </button>
                </div>

                <input type="text" id="inputBox" placeholder="नमस्ते! क्या पूछना चाहोगे?" autocomplete="off"
                    enterkeyhint="send" aria-label="Message input" />

                <button class="send-btn" id="sendBtn" type="button" aria-label="Send message">
                    <span class="send-text">Send</span>
                    <svg class="icon send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 2 11 13" />
                        <path d="M22 2 15 22l-4-9-9-4 20-7z" />
                    </svg>
                </button>

                <button class="send-btn stop-btn" id="stopBtn" type="button" aria-label="Stop reply" hidden>
                    <span class="send-text">Stop</span>
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                        <rect x="6" y="6" width="12" height="12" rx="2" />
                    </svg>
                </button>
            </div>

            <button class="login-btn" id="loginBtn" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span id="loginText">Login</span>
            </button>
        </footer>

    </div>
    </div><!-- /shell -->

    <!-- ========== LOGIN MODAL ========== -->
    <div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
        <div class="modal-box">
            <h2 id="loginTitle">Login</h2>
            <input type="text" id="nameInput" placeholder="Apna naam likho" autocomplete="off" />
            <div class="modal-actions">
                <button type="button" id="loginCancel">Cancel</button>
                <button type="button" id="loginSave" class="primary">Login</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="scene.js" defer></script>
    <script src="app.js" defer></script>
</body>

</html>
